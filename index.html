

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rose | My Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #fff;
            color: #333;
            text-align: center;
        }

        header {
            padding: 20px;
            background: #fce4ec;
        }

        nav a {
            margin: 10px;
            color: #333;
            text-decoration: none;
            cursor: pointer;
        }

        nav a:hover {
            color: #d63384;
        }

        section {
            padding: 50px 20px;
        }

        h1 {
            color: #d63384;
        }

        footer {
            padding: 15px;
            background: #fce4ec;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <header>
        <h2>Rose</h2>
        <nav>
            <a href="#" onclick="showPage('home')">Home</a>
            <a href="#" onclick="showPage('about')">About</a>
            <a href="#" onclick="showPage('contact')">Contact</a>
        </nav>
    </header>

    <section id="home">
        <h1>Hello, I'm Rose!</h1>
        <p>Welcome to my personal website.</p>
    </section>

    <section id="about" class="hidden">
        <h1>About Me</h1>
        <p>Hi! I'm Rose. This is my little corner of the internet.</p>
    </section>

    <section id="contact" class="hidden">
        <h1>Contact Me</h1>
        <p>Email: rose@example.com</p>
    </section>

    <footer>
        <p>&copy; 2026 Rose. All rights reserved.</p>
    </footer>

    <script>
        function showPage(page) {
            document.getElementById('home').classList.add('hidden');
            document.getElementById('about').classList.add('hidden');
            document.getElementById('contact').classList.add('hidden');

            document.getElementById(page).classList.remove('hidden');
        }
    </script>

</body>
</html>
